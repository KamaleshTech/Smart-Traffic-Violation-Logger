{% extends "base.html" %}

{% block title %}
Officer Login | Smart Traffic Violation Logger
{% endblock %}

{% block content %}
<div class="app-container auth-page">
    <div class="auth-wrap">
        <section class="auth-card" aria-label="Officer login form">
            <header class="auth-header">
                <div class="auth-kicker">Officer Access</div>
                <h1 class="auth-title">Officer Login</h1>
                <p class="auth-description">Sign in to manage traffic violation records.</p>
            </header>

            <div class="auth-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <input type="hidden" name="next" value="{{ next_page or '' }}">

                    <div class="field-group">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>

                    <div class="field-group">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-submit">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Sign In
                    </button>

                    <div class="auth-note">
                        <i class="bi bi-shield-check"></i>
                        Officer authentication is required for adding and managing violation records.
                    </div>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
